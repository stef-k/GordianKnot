plugins {
    id 'com.android.application'
}

android {
    namespace 'com.stef.offlinepassgen'
    compileSdk 35

    defaultConfig {
        applicationId "com.stef.offlinepassgen"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
