plugins {
    id 'com.android.application'
}

def releaseStoreFile = System.getenv('GORDIAN_KNOT_STORE_FILE')
def releaseStorePassword = System.getenv('GORDIAN_KNOT_STORE_PASSWORD')
def releaseKeyAlias = System.getenv('GORDIAN_KNOT_KEY_ALIAS')
def releaseKeyPassword = System.getenv('GORDIAN_KNOT_KEY_PASSWORD')
def releaseSigningAvailable = [
        releaseStoreFile,
        releaseStorePassword,
        releaseKeyAlias,
        releaseKeyPassword
].every { value -> value != null && !value.isBlank() }

android {
    namespace 'me.stefk.gordianknot'
    compileSdk 36
    buildToolsVersion '36.0.0'

    defaultConfig {
        applicationId "me.stefk.gordianknot"
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName "1.0.0"
    }

    signingConfigs {
        if (releaseSigningAvailable) {
            release {
                storeFile file(releaseStoreFile)
                storePassword releaseStorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (releaseSigningAvailable) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

gradle.taskGraph.whenReady { graph ->
    def requestsReleaseArtifact = graph.allTasks.any { task ->
        task.project == project && task.name.toLowerCase().contains('release')
    }
    if (requestsReleaseArtifact && !releaseSigningAvailable) {
        throw new GradleException('Release signing environment variables are required.')
    }
}
